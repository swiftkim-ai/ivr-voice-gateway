; PJSIP configuration for the POC softphone.
;
; Register a SIP softphone (Linphone, Zoiper, Orin):
;   Server:   127.0.0.1
;   Username: softphone
;   Password: ivrvg1234
;   Transport: UDP
;
; Then dial 7000 to reach the voice gateway.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[softphone]
type = endpoint
context = ivrvg
disallow = all
allow = ulaw
allow = alaw
auth = softphone-auth
aors = softphone-aor
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[softphone-auth]
type = auth
auth_type = userpass
username = softphone
password = ivrvg1234

[softphone-aor]
type = aor
max_contacts = 5
remove_existing = yes

; Trunk configuration lives in a separate file so the POC script can generate
; it from environment variables. An empty file is a no-op.
#include "pjsip_trunk.conf"
