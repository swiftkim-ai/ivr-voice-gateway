; Dialplan for the containerised test switch.
;
; Same shape as ../extensions.conf, with two differences: the media address
; reaches the gateway on the host, and there is an extra context that plays
; the caller so a call can be driven with no softphone.

[globals]
; Docker Desktop resolves this to the host. On Linux, run the container with
; --add-host=host.docker.internal:host-gateway.
IVRVG_MEDIA=host.docker.internal:8090

[ivrvg]
exten => 7000,1,NoOp(ivrvg: caller ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 ; ${UUID()} does not exist before Asterisk 22; MD5 of the uniqueid does.
 same => n,Set(RAW=${MD5(${UNIQUEID})})
 same => n,Set(IVRVG_UUID=${RAW:0:8}-${RAW:8:4}-${RAW:12:4}-${RAW:16:4}-${RAW:20:12})
 same => n,UserEvent(IvrvgStart,UUID: ${IVRVG_UUID},Hint: ${CALLERID(num)})
 same => n,AudioSocket(${IVRVG_UUID},${IVRVG_MEDIA})
 same => n,NoOp(ivrvg: audiosocket leg ended)
 same => n,Hangup()

; Outbound channel context used by `ivrvg dial` after the destination answers.
[ivrvg-out]
exten => s,1,NoOp(ivrvg outbound call ${IVRVG_UUID})
 same => n,Answer()
 same => n,UserEvent(IvrvgStart,UUID: ${IVRVG_UUID})
 same => n,AudioSocket(${IVRVG_UUID},${IVRVG_MEDIA})
 same => n,Hangup()

; Stands in for the caller: presses 2, then keys an account number mid-call.
; This is what makes the test runnable without a phone.
[ivrvg-caller]
exten => s,1,Answer()
 same => n,Wait(2)
 same => n,NoOp(caller presses 2)
 same => n,SendDTMF(2)
 same => n,Wait(3)
 same => n,NoOp(caller keys 48217#)
 same => n,SendDTMF(48217#)
 same => n,Wait(6)
 same => n,Hangup()

; Stub IVR for the outbound integration test. Simulates a two-path menu:
; the caller hears a greeting, then DTMF 1 goes to sales (extension 1),
; DTMF 2 goes to support (extension 2). After a pause, the stub hangs up.
;
; Because AudioSocket consumes the originating channel, PlayDTMF from the
; gateway does not cross the Local bridge. The stub therefore uses WaitExten
; with a generous timeout — if no DTMF arrives (expected in Phase 2), it
; falls through to a default path so the scenario still completes and the
; event log is written.
[stub-ivr]
exten => s,1,Answer()
 same => n,NoOp(stub-ivr: greeting)
 same => n,Wait(1)
 same => n,WaitExten(4)
 ; Timeout: fall through to the default path. The long wait ensures the
 ; stub stays alive while the scenario's timed steps run to completion.
 same => n,NoOp(stub-ivr: no DTMF received, default path)
 same => n,Wait(15)
 same => n,Hangup()

exten => 1,1,NoOp(stub-ivr: sales path)
 same => n,Wait(15)
 same => n,Hangup()

exten => 2,1,NoOp(stub-ivr: support path)
 same => n,Wait(15)
 same => n,Hangup()

; Where the agent's transfer lands, matching -ami-context default.
[default]
exten => 200,1,NoOp(ivrvg: TRANSFER ARRIVED at extension 200)
 same => n,Wait(2)
 same => n,Hangup()
