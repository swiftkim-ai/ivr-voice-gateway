; Manager account for the containerised test switch.
;
; The permissions are exactly what ../manager.conf grants, so running this
; test also verifies the documented minimum is enough: "user" delivers the
; dialplan's UserEvent, "call" delivers Hangup and allows Redirect.
;
; This binds to every interface because the gateway runs outside the
; container. The published port is bound to 127.0.0.1 on the host, and the
; switch exists only for the test, so the secret below is not a real one.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[ivrvg]
secret = testsecret
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = call,user
write = call
