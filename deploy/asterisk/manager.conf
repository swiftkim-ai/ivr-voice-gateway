; ivrvg — the manager account the gateway uses for the control channel.
;
; The gateway needs two things here: to read UserEvent (so it learns which
; channel a call is on) and Hangup (so it can forget again), and to write call
; actions (Redirect, PlayDTMF, Park, Hangup).
;
; Copy into /etc/asterisk/manager.conf, or include it from there, then reload
; with: asterisk -rx "manager reload"

[general]
enabled = yes
port = 5038
; Bind to localhost. AMI is a plaintext protocol with full control of the
; switch; if the gateway runs on another host, put it behind a VPN or a TLS
; tunnel rather than opening this port.
bindaddr = 127.0.0.1

[ivrvg]
; Set the same value in the gateway's IVRVG_AMI_SECRET environment variable.
; It is a password: it does not belong in the repo, a flag, or a shell history.
secret = change-me

deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255

; read: "user" delivers the dialplan's UserEvent, "call" delivers Hangup.
; write: "call" covers Redirect, PlayDTMF, Park and Hangup.
;        "originate" is needed for `ivrvg dial` and `ivrvg map`.
read = call,user
write = call,originate
