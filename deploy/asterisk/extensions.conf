; ivrvg — hand a live call to the voice AI, and take it back.
;
; This is the whole integration. The IVR keeps its dialplan; one extension
; hands media to the gateway and the agent can act on the call from there.
;
; Two lines matter:
;
;   UserEvent(IvrvgStart,...)  tells the gateway which Asterisk channel this
;                              call is on. AudioSocket carries audio and DTMF
;                              but no channel name, and actions — transfer,
;                              route, hangup — have to be addressed to one.
;                              Asterisk adds the Channel header itself.
;
;   AudioSocket(uuid,host:port)  streams the call to the gateway as 8 kHz mono
;                                16-bit PCM and streams the agent's voice back.
;
; Copy into /etc/asterisk/extensions.conf, or include it from there.

[globals]
; Where the gateway listens for AudioSocket. Keep this on localhost or a
; private interface: the protocol carries raw audio with no authentication.
IVRVG_MEDIA=127.0.0.1:8090

[ivrvg]
; Dial 7000 to reach the agent.
exten => 7000,1,NoOp(ivrvg: ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Set(IVRVG_UUID=${UUID()})
 same => n,UserEvent(IvrvgStart,UUID: ${IVRVG_UUID},Hint: ${CALLERID(num)})
 same => n,AudioSocket(${IVRVG_UUID},${IVRVG_MEDIA})
 same => n,Hangup()

; Where the agent's transfer and route actions land. The gateway redirects the
; channel into the context given by -ami-context (default: "default"), so point
; that at whichever context holds your real extensions.
;
; The sample brain transfers to 200 when the caller presses 1.
[default]
exten => 200,1,NoOp(ivrvg: transferred to sales)
 same => n,Dial(PJSIP/sales,30)
 same => n,Hangup()

exten => 100,1,NoOp(ivrvg: transferred to an operator)
 same => n,Dial(PJSIP/operator,30)
 same => n,Hangup()
