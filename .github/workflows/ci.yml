name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A newer push makes an in-flight run for the same ref pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 from
    # 2026-10-19, and a build should not change underneath us unannounced.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the Go version.
          go-version-file: go.mod
      # Formatting was a convention nothing checked, so a badly formatted
      # commit used to pass. Print the offenders rather than just failing.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  ts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth for the Node version.
          node-version-file: .nvmrc
      # npm ci installs exactly what the lock file pins; npm install may
      # silently resolve something newer.
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test test/*.test.ts

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The schema is the contract's source of truth, so a malformed one is a
      # build failure, not something to discover at integration time.
      - name: schema parses
        run: python3 -c "import json; json.load(open('schema/ivrvg.v1.schema.json'))"
      # The shipped manager config is a template. If a real password is ever
      # edited into it and committed, catch it here.
      - name: config template carries no real secret
        run: grep -q '^secret = change-me$' deploy/asterisk/manager.conf

  integration:
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: inbound integration test
        run: ./deploy/asterisk/docker/run-integration-test.sh
      - name: outbound integration test
        run: ./deploy/asterisk/docker/run-outbound-test.sh
      - name: escalation integration test
        run: ./deploy/asterisk/docker/run-escalation-test.sh
